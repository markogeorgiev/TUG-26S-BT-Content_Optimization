<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Wikipedia Pets Retrieval UI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Wikipedia Pets</p>
          <h1>Hybrid Retrieval Workspace</h1>
        </div>
        <p class="topbar-note">
          BM25 0.4 + MiniLM 0.4 + PageRank 0.2
        </p>
      </header>
      {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/search.js') }}" defer></script>
  </body>
</html>
