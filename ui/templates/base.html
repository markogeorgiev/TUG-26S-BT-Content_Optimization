<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Wikipedia Pets Retrieval UI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <div class="topbar">
          <div>
            <p class="eyebrow">Wikipedia Pets</p>
            <h1>Content Optimization Workspace</h1>
          </div>
          <p class="topbar-note">
            {% block topbar_note %}BM25 0.4 + MiniLM 0.4 + PageRank 0.2{% endblock %}
          </p>
        </div>
        <nav class="primary-nav" aria-label="Primary navigation">
          <a
            class="primary-nav-link{% if request.endpoint in ['index', 'search', 'query_results', 'download_query_results'] %} is-active{% endif %}"
            href="{{ url_for('index') }}"
          >
            Query
          </a>
          <a
            class="primary-nav-link{% if request.endpoint in ['rank_relationship', 'run_rank_relationship', 'rank_relationship_results', 'rank_relationship_output'] %} is-active{% endif %}"
            href="{{ url_for('rank_relationship') }}"
          >
            Rank Relationship
          </a>
          <a
            class="primary-nav-link{% if request.endpoint in ['content_change_experiments', 'select_content_change_experiment_article', 'run_content_change_experiment'] %} is-active{% endif %}"
            href="{{ url_for('content_change_experiments') }}"
          >
            Content Change Experiments
          </a>
          <a
            class="primary-nav-link{% if request.endpoint in ['features', 'article_features', 'article_feature_detail', 'article_suggestions', 'rank_feature_plots', 'rank_feature_plot_image'] %} is-active{% endif %}"
            href="{{ url_for('features') }}"
          >
            Content Features
          </a>
        </nav>
      </header>
      {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/search.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/features.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/experiments.js') }}" defer></script>
  </body>
</html>
